<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="functax is built around one expansion, a field x of the coordinates s equal to the sum over d of z_d phi_d of s, and five operations on it: interpolate, differentiate, integrate, project and transform, each in its own module, over a basis library and CRS-free geometry.">
<title>One expansion, five operations</title>
<defs><marker id="hero-light-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs>
<rect x="230" y="20" width="500" height="92" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="348" y="62" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="400" fill="#1F2937" xml:space="preserve">x(<tspan font-weight="700">s</tspan>) ≈ ∑<tspan baseline-shift="-6" font-size="16.8">d</tspan> z<tspan baseline-shift="-6" font-size="16.8">d</tspan> φ<tspan baseline-shift="-6" font-size="16.8">d</tspan>(<tspan font-weight="700">s</tspan>; <tspan font-weight="700">θ</tspan>)</text>
<text x="480" y="90" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280" xml:space="preserve">one expansion of the field x: coefficients z, basis functions φ, parameters θ</text>
