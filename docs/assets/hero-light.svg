<text x="384" y="242" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#6B7280" xml:space="preserve">functax.quad</text>
