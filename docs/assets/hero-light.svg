<rect x="545" y="168" width="160" height="172" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
<text x="559" y="194" text-anchor="start" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1D4ED8" xml:space="preserve">project</text>
<text x="559" y="218" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1F2937" xml:space="preserve"><tspan font-weight="700">ẑ</tspan> = argmin ‖<tspan font-weight="700">Φ</tspan><tspan font-weight="700">z</tspan> − <tspan font-weight="700">y</tspan>‖²</text>
