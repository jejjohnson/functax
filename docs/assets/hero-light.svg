<text x="34" y="218" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#1F2937" xml:space="preserve"><tspan font-weight="700">y</tspan> = <tspan font-weight="700">H</tspan> <tspan font-weight="700">x</tspan>,  <tspan font-weight="700">H</tspan>ᵀ <tspan font-weight="700">r</tspan></text>
