# functax's shelf: its modules, its listed skills, its units and its entries.
#
# Every public name of every module below belongs to exactly one entry (gate
# SH-1), and the entry's file names it. scripts/skill_shelf.py writes the
# generated parts of the three SKILL.md files from this file and checks the gates.

# Where the public names are read from: module = its file, from the root.
[modules]
"functax" = "src/functax/__init__.py"
"functax.exceptions" = "src/functax/exceptions.py"
"functax.geometry" = "src/functax/geometry/__init__.py"
"functax.geometry.affine" = "src/functax/geometry/affine.py"
"functax.interp" = "src/functax/interp.py"
"functax.basis.eigen" = "src/functax/basis/eigen.py"
"functax.basis.features" = "src/functax/basis/features.py"
"functax.basis.fourier" = "src/functax/basis/fourier.py"
"functax.basis.local" = "src/functax/basis/local.py"
"functax.basis.polynomial" = "src/functax/basis/polynomial.py"
"functax.basis.slepian" = "src/functax/basis/slepian.py"
"functax.basis.sphere" = "src/functax/basis/sphere.py"
"functax.basis.vector" = "src/functax/basis/vector.py"
"functax.quad" = "src/functax/quad.py"
"functax.diffops" = "src/functax/diffops.py"
"functax.project" = "src/functax/project.py"
"functax.transform" = "src/functax/transform.py"

[skills.function-approximation-with-functax]
builds_on_units = []

[skills.interpolation-with-functax]
builds_on_units = ["geometry"]

[skills.bases-quadrature-and-transforms]
builds_on_units = ["geometry"]

[units.geometry]
title = "Geometry"
rungs = "⓪"
skill = "function-approximation-with-functax"

[units.errors]
title = "Errors and installs"
rungs = "⓪"
skill = "function-approximation-with-functax"

[units.interp]
title = "Interpolation"
rungs = "① ②, setup"
skill = "interpolation-with-functax"

[units.basis]
title = "Bases"
rungs = "①"
skill = "bases-quadrature-and-transforms"

[units.quad]
title = "Quadrature"
rungs = "⓪ ①"
skill = "bases-quadrature-and-transforms"

[units.diffops]
title = "Differential operators"
rungs = "①"
skill = "bases-quadrature-and-transforms"

[units.project]
title = "Projection"
rungs = "① ④"
skill = "bases-quadrature-and-transforms"

[units.transform]
title = "Transforms"
rungs = "setup"
skill = "bases-quadrature-and-transforms"

