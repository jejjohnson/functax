# PR auto-labeling rules.
#
# Applied by .github/workflows/label-pr.yml using actions/labeler.
# Labels referenced here must exist — run `uv run poe gh-labels` to create them.
# The `dependencies` label is also created by the bootstrap script so this
# file works on a fresh repo with no manual label setup.
#
# Scopes below map file paths to the standard taxonomy:
#   area:*   — which part of the project the change touches
#   type:*   — left to issue templates (NOT auto-applied on PRs)

"area:engineering":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"

"area:docs":
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "mkdocs.yml"
      - "notebooks/**"
      - "*.md"

"area:testing":
  - changed-files:
    - any-glob-to-any-file: "tests/**"

# One area per public module: the public re-export and its private tree under _src.
"area:geometry":
  - changed-files:
    - any-glob-to-any-file:
      - "src/functax/geometry.py"
      - "src/functax/geometry/**"
      - "src/functax/_src/geometry/**"

"area:basis":
  - changed-files:
    - any-glob-to-any-file:
      - "src/functax/basis.py"
      - "src/functax/basis/**"
      - "src/functax/_src/basis/**"

"area:diffops":
  - changed-files:
    - any-glob-to-any-file:
      - "src/functax/diffops.py"
      - "src/functax/diffops/**"
      - "src/functax/_src/diffops/**"

"area:interp":
  - changed-files:
    - any-glob-to-any-file:
      - "src/functax/interp.py"
      - "src/functax/interp/**"
      - "src/functax/_src/interp/**"

"area:quad":
  - changed-files:
    - any-glob-to-any-file:
      - "src/functax/quad.py"
      - "src/functax/quad/**"
      - "src/functax/_src/quad/**"

"area:transform":
  - changed-files:
    - any-glob-to-any-file:
      - "src/functax/transform.py"
      - "src/functax/transform/**"
      - "src/functax/_src/transform/**"

"area:project":
  - changed-files:
    - any-glob-to-any-file:
      - "src/functax/project.py"
      - "src/functax/project/**"
      - "src/functax/_src/project/**"

# --- Default / legacy labels retained for Dependabot compatibility ---------

"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"
